name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Resolve version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag $GITHUB_REF_NAME -> version $VERSION"
      - name: Verify version is consistent across manifests
        shell: bash
        run: bash .github/scripts/verify-version.sh "${{ steps.meta.outputs.version }}"
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: bash .github/scripts/extract-changelog-notes.sh "${{ steps.meta.outputs.version }}" release_notes.md
      - name: Upload release notes for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 1
          if-no-files-found: error
      - id: draft
        name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: true
          prerelease: false
  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
            updater: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      - id: notes
        name: Load release notes for updater JSON
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat release_notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build, bundle, and upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        with:
          projectPath: ./client
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseBody: ${{ steps.notes.outputs.body }}
          args: ${{ matrix.args }}
          includeUpdaterJson: ${{ matrix.updater }}